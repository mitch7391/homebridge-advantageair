<!doctype html>
<meta charset="utf-8">
<title>Increment 2B-0 isolated preview</title>
<style>body { font: 16px system-ui; margin: 24px; } iframe { width: 100%; height: 1100px; border: 1px solid #aaa; }</style>
<h1>Isolated UI preview — simulated Homebridge host</h1>
<p>No Homebridge process, pairing, controller connection or disk configuration writes.
  These preview Save/Cancel buttons do not establish real Homebridge acceptance.</p>
<button id="save" disabled>Simulate Save</button>
<button id="cancel">Simulate Cancel / reopen</button>
<p id="result" role="status"></p>
<iframe id="ui" title="Advantage Air prototype"></iframe>
<script type="module">
  const copy = value => JSON.parse(JSON.stringify(value));
  let saved = [{
    platform: 'AdvantageAir', name: 'Synthetic platform log', future: { preserved: true },
    devices: [
      { homeName: 'Main Home', name: 'Synthetic log A', ipAddress: '192.0.2.1', excludedLightIds: ['light1'],
        things: [{ controllerId: 'synthetic-a', id: 'door1', disabled: true, invert: true, type: 'gate' }] },
      { homeName: 'Things Only', name: 'Synthetic log B', ipAddress: '192.0.2.2', port: 10211, zoneControlType: 'fans' },
    ],
  }, { accessory: 'Other block', preserved: ['yes'] }];
  let draft = copy(saved);
  const schema = await (await fetch('/config.schema.json')).json();
  const markup = await (await fetch('/homebridge-ui/public/index.html')).text();
  let generation = 0;
  function open() {
    const current = ++generation;
    draft = copy(saved);
    document.getElementById('save').disabled = true;
    window.prototypeApi = {
      getPluginConfig: async () => copy(draft),
      getPluginConfigSchema: async () => copy(schema),
      updatePluginConfig: async value => {
        if (current !== generation) throw new Error('Closed preview');
        draft = copy(value);
        return copy(draft);
      },
      disableSaveButton: () => { if (current === generation) document.getElementById('save').disabled = true; },
      enableSaveButton: () => { if (current === generation) document.getElementById('save').disabled = false; },
    };
    document.getElementById('ui').srcdoc = '<base href="/homebridge-ui/public/"><script>window.homebridge=parent.prototypeApi;<\/script>' + markup;
  }
  document.getElementById('save').onclick = () => {
    saved = copy(draft);
    document.getElementById('result').textContent = JSON.stringify(saved);
    open();
  };
  document.getElementById('cancel').onclick = open;
  open();
</script>
