name: Cmd4 Node test
on: {push: {branches: [test/cmd4-node26]}}
permissions: {contents: read}
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy: {fail-fast: false, matrix: {node: ['24.19.0', '26.13.0']}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Reject incomplete workflow
        run: test "$(wc -l < .github/workflows/cmd4-node26-compat.yml)" -ge 79
      - name: Test Cmd4 with v3 simulator
        shell: bash
        run: |
          set -euo pipefail
          command -v jq
          npm ci --ignore-scripts --no-audit --no-fund
          lab="$RUNNER_TEMP/cmd4-test"
          mkdir -p "$lab"
          echo '{"name":"cmd4-test","version":"1.0.0","private":true}' > "$lab/package.json"
          (cd "$lab" && npm install --ignore-scripts --no-audit --no-fund homebridge@2.5.0 homebridge-cmd4@8.0.4)
          export LAB="$lab" CALLS="$lab/calls.log"
          sim='' hb=''
          cleanup() {
            for pid in "$hb" "$sim"; do
              [[ -z "$pid" ]] || { kill "$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :; }
            done
            tail -n 40 "$lab/hb.log" 2>/dev/null || :
            cat "$CALLS" 2>/dev/null || :
          }
          trap cleanup EXIT
          (cd test && PORT=2025 node AirConServer.js) > "$lab/sim.log" 2>&1 & sim=$!
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:2025/reInit >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:2025/reInit >/dev/null
          curl -fsSg 'http://127.0.0.1:2025?load=testData/basicPassingSystemData.txt' >/dev/null
          cat > "$lab/wrap.sh" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >> "$CALLS"
          exec bash "$GITHUB_WORKSPACE/AdvAir.sh" "$@"
          SH
          chmod +x "$lab/wrap.sh"
          node <<'JS'
          const fs=require('node:fs'),p=require('node:path'),l=process.env.LAB;
          fs.mkdirSync(p.join(l,'storage'));
          fs.writeFileSync(p.join(l,'storage/config.json'),JSON.stringify({
            bridge:{name:'Cmd4 Test',username:'0E:26:00:00:00:11',port:53728,pin:'031-45-154'},accessories:[],
            platforms:[{platform:'Cmd4',name:'Cmd4',accessories:[{type:'Switch',name:'Fan',displayName:'Fan',on:'FALSE',
              state_cmd:`bash "${l}/wrap.sh"`,state_cmd_suffix:'127.0.0.1:2025',
              polling:[{characteristic:'on',interval:5,timeout:5000}]}]}]}));
          JS
          node "$lab/node_modules/homebridge/bin/homebridge.js" -U "$lab/storage" -P "$lab/node_modules/homebridge-cmd4" --strict-plugin-resolution -Q > "$lab/hb.log" 2>&1 & hb=$!
          count=0
          for i in {1..115}; do
            count=$(grep -c '^Get Fan On 127\.0\.0\.1:2025$' "$CALLS" 2>/dev/null || :)
            [[ "$count" -ge 2 ]] && break
            kill -0 "$hb" 2>/dev/null
            sleep 1
          done
          [[ "$count" -ge 2 ]]
          grep -q 'Loaded plugin: homebridge-cmd4@8.0.4' "$lab/hb.log"
          ! grep -Eq 'getValue On function failed|Cannot convert value|Failed to publish bridge' "$lab/hb.log"
          kill "$hb" 2>/dev/null || :; wait "$hb" 2>/dev/null || :; hb=''
          node <<'JS'
          const p=require('node:path'),l=process.env.LAB;
          const {Cmd4PriorityPollingQueue:Q}=require(p.join(l,'node_modules/homebridge-cmd4/Cmd4PriorityPollingQueue.js'));
          const log={debugEnabled:false,debug(){},info(){},warn:console.error,error:console.error},q=new Q(log,'test');
          const a={displayName:'Fan',state_cmd:`bash "${l}/wrap.sh"`,state_cmd_prefix:'',state_cmd_suffix:' 127.0.0.1:2025',hV:{outputConstants:false,statusMsg:'FALSE'},log,queue:q};
          const t=setTimeout(()=>process.exit(2),15000);
          q.qSetValue(a,0,'On',10000,true,rc=>{clearTimeout(t);if(rc!==0)process.exitCode=1});
          JS
          grep -q '^Set Fan On 1 127\.0\.0\.1:2025$' "$CALLS"
          echo "PASS integration on $(node --version)"
