# Temporary compatibility experiment. Do not merge into v3-maintenance.
name: Temporary Cmd4 / Advantage Air v3 Node compatibility

on:
  push:
    branches:
      - test/cmd4-node26

permissions:
  contents: read

jobs:
  v3-regression:
    name: v3 simulator tests / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['24.19.0', '26.13.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Linux test utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq lsof shellcheck libatomic1
      - name: Install v3 test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The unchanged v3 Bats suite has three jq 1.7.1 numeric presentation
      # expectations (21 vs 21.0, 23 vs 23.0) on BOTH Node versions.
      # Record them explicitly; unexpected failures remain fatal.
      - name: Run v3 Bash simulator tests and classify known baseline mismatches
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          set +e
          npm run allBats > "$RUNNER_TEMP/v3-bats.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/v3-bats.log"
          if [[ "$rc" -eq 0 ]]; then
            echo 'PASS: All v3 Bash tests passed'
          else
            failures=$(grep -E '^not ok [0-9]+ ' "$RUNNER_TEMP/v3-bats.log" | sed -E 's/^not ok ([0-9]+).*/\1/' | paste -sd, - || true)
            [[ "$failures" == '21,38,67' ]] || { echo "::error::Unexpected Bash test failures: $failures"; exit 1; }
            [[ $(grep -c 'actual   : 21.0' "$RUNNER_TEMP/v3-bats.log") -eq 2 ]] || exit 1
            [[ $(grep -c 'actual   : 23.0' "$RUNNER_TEMP/v3-bats.log") -eq 1 ]] || exit 1
            [[ $(grep -Ec '^(ok|not ok) [0-9]+ ' "$RUNNER_TEMP/v3-bats.log") -eq 112 ]] || exit 1
            echo '::warning::Three unchanged v3 tests expect integers but jq returns decimal formatting on Ubuntu; compare Node 24 and 26 logs.'
          fi
      - name: Run v3 JavaScript and static checks
        run: |
          npm run testjs
          npm run test:announcement
          npm run check
          npm run lint

  cmd4-v3-integration:
    name: Cmd4 + v3 integration / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24.19.0', '26.13.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install simulator dependencies and Linux tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq lsof libatomic1
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install released Cmd4 and Homebridge in a separate directory
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/cmd4-compat"
          mkdir -p "$lab"
          printf '%s\n' '{"name":"cmd4-node-compat","version":"1.0.0","private":true}' > "$lab/package.json"
          cd "$lab"
          npm install --save-exact --ignore-scripts --no-audit --no-fund homebridge@2.5.0 homebridge-cmd4@8.0.4
          node -e 'const assert=require("node:assert/strict"),fs=require("node:fs"); assert.equal(JSON.parse(fs.readFileSync("node_modules/homebridge/package.json","utf8")).version,"2.5.0"); assert.equal(JSON.parse(fs.readFileSync("node_modules/homebridge-cmd4/package.json","utf8")).version,"8.0.4");'
      - name: Test actual Cmd4 polling and Set calls against the v3 simulator
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/cmd4-compat"
